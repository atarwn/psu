[package]
name = "psu"
version = "3.0.0"
edition = "2024"
license = "MIT"
authors = ["IwantHappiness"]
description = "Password storage utility."

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
# panic = "abort"

[dependencies]
csv = "1.4.0"
dirs = "7.0.0"
toml = "1.1.8"
anyhow = "1.0.104"
crossterm = "0.29.0"
unicode-width = "0.2.2"
ratatui = { version = "0.30.2", features = ["macros"] }
serde = { version = "1.0.229", features = ["derive"] }
tui-input = { version = "0.15.5", features = ["serde"] }
config = "0.15.27"

rusqlite = { version = "0.32", features = ["bundled"] }
argon2 = "0.5"
chacha20poly1305 = "0.10"
rand = "0.8"
zeroize = "1"
secrecy = "0.8"
rpassword = "7"
arboard = "3"
